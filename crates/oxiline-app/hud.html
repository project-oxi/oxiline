<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OxiLine HUD</title>
    <!-- FOUC prevention (DESIGN.md §8.2). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("oxi-theme");
          var d =
            t === "dark" ||
            (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", d);
        } catch (_) {}
      })();
    </script>
    <!-- SUIT Variable: UI/body — DESIGN.md §4.2 -->
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css"
    />
    <!-- Geist Mono Variable: time/numbers — DESIGN.md §4.2 (Fontsource) -->
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/fontsource/fonts/geist-mono:vf@latest/index.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/hud.tsx"></script>
  </body>
</html>
