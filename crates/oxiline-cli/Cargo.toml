[package]
name = "oxiline-cli"
description = "Command-line interface for the OxiLine recording and planning application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "oxiline"
path = "src/main.rs"

[dependencies]
oxiline-core.workspace = true
chrono.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
rusqlite.workspace = true
# Self-update engine (`doc/10-updater.md`). The CLI is the only place that
# downloads / verifies / swaps; the GUI is a thin view that spawns this
# binary as a sidecar and parses its `--json-progress` NDJSON contract.
ureq = { version = "2", default-features = false, features = ["tls"] }
minisign-verify = "0.2"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
base64 = "0.22"
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
