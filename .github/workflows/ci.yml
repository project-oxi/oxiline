name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Cross-platform gate: pure-Rust core + CLI, no platform-specific deps.
  # Tauri app is excluded so this job is green on linux runners.
  # ─────────────────────────────────────────────────────────────────────────────
  rust-core:
    name: Rust core + CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (1.85 + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/oxiline-core
            crates/oxiline-cli

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy -p oxiline-core -p oxiline-cli --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build -p oxiline-core -p oxiline-cli --locked

      - name: Test
        run: cargo test -p oxiline-core -p oxiline-cli --locked

  # ─────────────────────────────────────────────────────────────────────────────
  # macOS-only gate: Tauri v2 app (uses macos-only git deps and
  # macos-private-api feature).
  # ─────────────────────────────────────────────────────────────────────────────
  app-macos:
    name: Tauri app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (1.85 + clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85
          components: clippy

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/oxiline-app/src-tauri

      - name: Install frontend deps
        working-directory: crates/oxiline-app
        run: bun install --frozen-lockfile

      - name: Frontend typecheck + build
        working-directory: crates/oxiline-app
        run: bun run build

      - name: Rust clippy (app)
        run: cargo clippy -p oxiline-app --all-targets --locked -- -D warnings

      - name: Build Tauri app
        run: cargo build -p oxiline-app --locked
