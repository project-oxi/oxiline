name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

# Toolchain selection is governed by the repo's `rust-toolchain.toml`:
#   channel = "1.89"             — workspace MSRV (let-chains, etc.)
#   targets = [aarch64, x86_64]  — apple-darwin stdlib for the matrix jobs
#                                  + Tauri's universal-apple-darwin
# Anything set here would be redundant or shadowed.

jobs:
  cli:
    name: Build CLI binaries
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (1.89 + target stdlib)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --bin oxiline --target ${{ matrix.target }} --locked

      - name: Package
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/oxiline out/oxiline-${{ matrix.target }}
          (cd out && tar -czf oxiline-${{ matrix.target }}.tar.gz oxiline-${{ matrix.target }})

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxiline-${{ matrix.target }}
          path: out/oxiline-${{ matrix.target }}.tar.gz

  app:
    name: Build signed Tauri app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (1.89 + apple-darwin stdlibs)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/oxiline-core
            crates/oxiline-app/src-tauri

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend deps
        working-directory: crates/oxiline-app
        run: bun install --frozen-lockfile

      - name: Build Tauri app (universal, signed, notarized, .app + DMG)
        # tauri-action performs Apple code-signing + notarization + bundle
        # generation. We deliberately omit `tagName` / `releaseName` so the
        # action does NOT touch GitHub Releases; the `release` job below is
        # the single source of truth for the Release, using the signed
        # artifacts uploaded here.
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: crates/oxiline-app/src-tauri
          args: --target universal-apple-darwin --bundles app,dmg

      - name: Upload signed bundles
        uses: actions/upload-artifact@v4
        with:
          name: oxiline-app-bundle
          path: |
            crates/oxiline-app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            crates/oxiline-app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz

  release:
    name: GitHub Release
    needs: [cli, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Download app bundle (DMG + .app.tar.gz)
        uses: actions/download-artifact@v4
        with:
          name: oxiline-app-bundle
          path: artifacts/app

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/oxiline-*.tar.gz
            artifacts/app/**/*.dmg
            artifacts/app/**/*.app.tar.gz
