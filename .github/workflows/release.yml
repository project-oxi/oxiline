name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

# Toolchain selection is governed by the repo's `rust-toolchain.toml`:
#   channel = "1.89"             — workspace MSRV (let-chains, etc.)
#   targets = [aarch64, x86_64]  — apple-darwin stdlib for the matrix jobs
#                                  + Tauri's universal-apple-darwin
# Anything set here would be redundant or shadowed.

jobs:
  cli:
    name: Build CLI binaries
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (1.89 + target stdlib)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --bin oxiline --target ${{ matrix.target }} --locked

      - name: Package
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/oxiline out/oxiline-${{ matrix.target }}
          (cd out && tar -czf oxiline-${{ matrix.target }}.tar.gz oxiline-${{ matrix.target }})

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxiline-${{ matrix.target }}
          path: out/oxiline-${{ matrix.target }}.tar.gz

  app:
    name: Build signed Tauri app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (1.89 + apple-darwin stdlibs)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/oxiline-core
            crates/oxiline-app/src-tauri

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend deps
        working-directory: crates/oxiline-app
        run: bun install --frozen-lockfile

      # Build the `oxiline` CLI as a universal binary and stage it as a Tauri
      # externalBin sidecar so the .app bundle ships a signed, runnable
      # `oxiline` command (Settings → "Install command" symlinks it onto PATH).
      # The downstream tauri-action builds a *universal* app, which requires
      # the sidecar at `binaries/oxiline-universal-apple-darwin` (Tauri looks
      # up `<externalBin-base>-<target-triple>`). lipo merges the aarch64 and
      # x86_64 release builds into one fat binary at that exact path.
      - name: Build CLI sidecar (universal)
        run: |
          mkdir -p crates/oxiline-app/src-tauri/binaries
          cargo build --release -p oxiline-cli --target aarch64-apple-darwin
          cargo build --release -p oxiline-cli --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/oxiline \
            target/x86_64-apple-darwin/release/oxiline \
            -output crates/oxiline-app/src-tauri/binaries/oxiline-universal-apple-darwin
      - name: Build Tauri app (universal, signed, notarized, .app + DMG)
        # tauri-action performs Apple code-signing + notarization + bundle
        # generation. We deliberately omit `tagName` / `releaseName` so the
        # action does NOT touch GitHub Releases; the `release` job below is
        # the single source of truth for the Release, using the signed
        # artifacts uploaded here.
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Key generated without a password (CI automation); the empty
          # value is set explicitly so tauri doesn't prompt in the runner.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: crates/oxiline-app/src-tauri
          args: --target universal-apple-darwin --bundles app,dmg

      - name: Upload signed bundles
        uses: actions/upload-artifact@v4
        with:
          name: oxiline-app-bundle
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  release:
    name: GitHub Release
    needs: [cli, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Download app bundle (DMG + .app.tar.gz)
        uses: actions/download-artifact@v4
        with:
          name: oxiline-app-bundle
          path: artifacts/app

      - name: Generate updater manifest (latest.json)
        run: |
          set -euo pipefail
          SIG_FILE=$(find artifacts/app -name '*.app.tar.gz.sig' -print -quit)
          [ -n "$SIG_FILE" ] || { echo "no .app.tar.gz.sig under artifacts/app" >&2; exit 1; }
          SIG=$(cat "$SIG_FILE")
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/project-oxi/oxiline/releases/download/${GITHUB_REF_NAME}/OxiLine.app.tar.gz"
          PUB=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # jq --arg safely JSON-encodes the multi-line minisign signature.
          # (printf would inject raw newlines → invalid JSON → updater fails.)
          jq -n \
            --arg version "$VERSION" \
            --arg notes "OxiLine $VERSION" \
            --arg pub_date "$PUB" \
            --arg sig "$SIG" \
            --arg url "$URL" \
            '{version:$version,notes:$notes,pub_date:$pub_date,platforms:{darwin-aarch64:{signature:$sig,url:$url},"darwin-x86_64":{signature:$sig,url:$url}}}' \
            > artifacts/latest.json
          cat artifacts/latest.json
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/oxiline-*.tar.gz
            artifacts/app/**/*.dmg
            artifacts/app/**/*.app.tar.gz
            artifacts/app/**/*.app.tar.gz.sig
            artifacts/latest.json


  crates-io:
    name: Publish to crates.io
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish oxiline-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p oxiline-core --no-verify

      - name: Wait for crates.io index propagation
        run: sleep 30

      - name: Publish oxiline-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p oxiline-cli --no-verify